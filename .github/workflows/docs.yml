name: Documentation
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: documentation
  cancel-in-progress: false

# mike commits every version to the gh-pages branch and GitHub Pages serves that
# branch (Settings > Pages > Deploy from a branch: gh-pages, / (root)).
# An Actions Pages deployment is keyed by commit SHA, so a release tag on a
# commit already deployed from main would be silently ignored.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical "mkdocstrings[python]" "mike @ git+https://github.com/squidfunk/mike.git"
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy development documentation
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          if ! mike list latest >/dev/null 2>&1; then
            mike set-default --push dev
          fi
      - name: Deploy release documentation
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mike deploy --push --update-aliases --alias-type redirect "$GITHUB_REF_NAME" latest
          mike set-default --push latest
